<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Choose Learning Goal - NeuroMnemonic AI
    </title>

    <link
        rel="stylesheet"
        href="css/goal-setup.css"
    >

</head>


<body>

    <div class="goal-container">

        <header class="goal-header">

            <div class="page-icon">
                🎯
            </div>

            <h1>
                Set Your Learning Goals
            </h1>

            <p>
                Choose what you want to prepare for.
            </p>

        </header>


        <div class="goal-card">

            <form id="goalSelectionForm">

                <div class="selection-heading">

                    <h2>
                        What do you want to prepare for?
                    </h2>

                    <p>
                        Select one option to continue.
                    </p>

                </div>


                <div class="goal-options">


                    <!-- ACADEMIC -->

                    <label class="goal-option">

                        <input
                            type="radio"
                            name="goalType"
                            value="Academic"
                        >

                        <div class="goal-option-content">

                            <div class="goal-icon">
                                🎓
                            </div>

                            <div>

                                <strong>
                                    Academic
                                </strong>

                                <small>
                                    Prepare for college subjects,
                                    semester examinations and academic learning.
                                </small>

                            </div>

                        </div>

                    </label>


                    <!-- COMPETITIVE -->

                    <label class="goal-option">

                        <input
                            type="radio"
                            name="goalType"
                            value="Competitive Exam"
                        >

                        <div class="goal-option-content">

                            <div class="goal-icon">
                                🏆
                            </div>

                            <div>

                                <strong>
                                    Competitive Exam
                                </strong>

                                <small>
                                    Prepare for TNPSC, UPSC, SSC,
                                    Banking, Railway and other competitive exams.
                                </small>

                            </div>

                        </div>

                    </label>


                    <!-- BOTH -->

                    <label class="goal-option">

                        <input
                            type="radio"
                            name="goalType"
                            value="Both"
                        >

                        <div class="goal-option-content">

                            <div class="goal-icon">
                                🔄
                            </div>

                            <div>

                                <strong>
                                    Both
                                </strong>

                                <small>
                                    Prepare for academic studies and
                                    competitive examinations.
                                </small>

                            </div>

                        </div>

                    </label>

                </div>


                <p
                    id="message"
                    class="message"
                ></p>


                <div class="button-area">

                    <button
                        type="button"
                        class="back-btn"
                        onclick="goBack()"
                    >
                        ← Back
                    </button>

                    <button
                        type="submit"
                        class="continue-btn"
                    >
                        Continue →
                    </button>

                </div>


            </form>

        </div>

    </div>


    <script src="js/goal-setup.js"></script>

</body>

</html>
