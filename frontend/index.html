<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroMnemonic AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef4ff, #f7f0ff);
        }

        .container {
            width: 90%;
            max-width: 850px;
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 38px;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 20px;
            color: #555;
            margin-bottom: 15px;
        }

        .description {
            color: #777;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .register {
            background: #2563eb;
            color: white;
        }

        .login {
            background: #e8efff;
            color: #2563eb;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 35px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🧠</div>

        <h1>NeuroMnemonic AI</h1>

        <p class="tagline">
            AI-Based Personalized Learning & Memory Assistant
        </p>

        <p class="description">
            Learn smarter, remember better, and prepare effectively
            with personalized study guidance, AI assistance,
            mnemonics and learning support.
        </p>

        <div class="buttons">
            <button class="register"
                    onclick="window.location.href='register.html'">
                Get Started
            </button>

            <button class="login"
                    onclick="window.location.href='login.html'">
                Login
            </button>
        </div>

        <div class="footer">
            Your personalized learning journey starts here 🚀
        </div>

    </div>

</body>
</html>
