<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuroMnemonic AI | Revision</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #12172B;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #cccccc;
        }

        .card {
            background: #1c2340;
            padding: 25px;
            border-radius: 15px;
            margin-top: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: none;
            margin-bottom: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .add-btn {
            width: 100%;
            background: #f5b942;
            color: #12172B;
            font-weight: bold;
        }

        .revision-item {
            background: #252d4d;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .complete-btn {
            background: #4caf50;
            color: white;
        }

        .completed {
            opacity: 0.7;
        }

        .message {
            margin-top: 15px;
        }

        .empty {
            color: #bbbbbb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔄 Revision Tracker</h1>

        <p class="subtitle">
            Revise completed topics and track your revision progress.
        </p>


        <!-- CREATE REVISION -->

        <div class="card">

            <h2>📝 Add Revision</h2>

            <form id="revisionForm">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Example: Java"
                    required
                >


                <label for="topic">
                    Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="Example: Inheritance"
                    required
                >


                <label for="revisionDate">
                    Revision Date
                </label>

                <input
                    type="date"
                    id="revisionDate"
                    required
                >


                <button
                    type="submit"
                    class="add-btn"
                >
                    ➕ Add Revision
                </button>

            </form>

            <p
                id="message"
                class="message"
            ></p>

        </div>


        <!-- REVISION LIST -->

        <div class="card">

            <h2>📚 My Revisions</h2>

            <div id="revisionList">

                <p class="empty">
                    No revisions yet.
                </p>

            </div>

        </div>

    </div>


    <script src="js/revision.js"></script>

</body>

</html>
