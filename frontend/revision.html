<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuroMnemonic AI | Revision</title>

    <link rel="stylesheet" href="css/revision.css">
</head>

<body>

    <div class="container">

        <h1>🔄 Revision Tracker</h1>

        <p class="subtitle">
            Revise completed topics and track your revision progress.
        </p>


        <!-- CREATE REVISION -->

        <div class="card">

            <h2>📝 Add Revision</h2>

            <form id="revisionForm">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Example: Java"
                    required
                >

                <label for="topic">
                    Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="Example: Inheritance"
                    required
                >

                <label for="revisionDate">
                    Revision Date
                </label>

                <input
                    type="date"
                    id="revisionDate"
                    required
                >

                <button
                    type="submit"
                    class="add-btn"
                >
                    ➕ Add Revision
                </button>

            </form>

            <p
                id="message"
                class="message"
            ></p>

        </div>


        <!-- REVISION LIST -->

        <div class="card">

            <h2>📚 My Revisions</h2>

            <div id="revisionList">

                <p class="empty">
                    No revisions yet.
                </p>

            </div>

        </div>

    </div>


    <script src="js/revision.js"></script>

</body>

</html>
