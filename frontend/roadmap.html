<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personalized Learning Roadmap | NeuroMnemonic AI</title>

    <link rel="stylesheet" href="css/roadmap.css">
</head>

<body>

    <div class="page-container">

        <!-- HEADER -->
        <header class="page-header">

            <div>
                <h1>🧠 NeuroMnemonic AI</h1>
                <p>Personalized Learning Roadmap</p>
            </div>

            <button
                id="backDashboardBtn"
                class="back-btn"
                type="button"
            >
                ← Dashboard
            </button>

        </header>


        <!-- MAIN -->
        <main class="learning-container">

            <!-- WELCOME -->
            <div class="welcome-section">

                <h2>
                    Create Your Personalized Learning Roadmap
                </h2>

                <p>
                    Enter your learning details and generate a
                    personalized day-wise learning roadmap.
                </p>

            </div>


            <!-- TOPIC -->
            <div class="input-section">

                <label for="topic">
                    📚 Learning Topic
                </label>

                <input
                    type="text"
                    id="topic"
                    placeholder="Example: Java, Python, OSI Layers..."
                    autocomplete="off"
                >

            </div>


            <!-- PREFERENCES -->
            <div class="preferences">

                <!-- LANGUAGE -->
                <div class="preference-box">

                    <label for="language">
                        🌐 Preferred Language
                    </label>

                    <select id="language">

                        <option value="English">
                            English
                        </option>

                        <option value="Tamil">
                            Tamil
                        </option>

                        <option value="Bilingual">
                            Bilingual
                        </option>

                    </select>

                </div>


                <!-- LEVEL -->
                <div class="preference-box">

                    <label for="level">
                        🎯 Learning Level
                    </label>

                    <select id="level">

                        <option value="Beginner">
                            Beginner
                        </option>

                        <option value="Intermediate">
                            Intermediate
                        </option>

                        <option value="Advanced">
                            Advanced
                        </option>

                    </select>

                </div>


                <!-- DURATION -->
                <div class="preference-box">

                    <label for="duration">
                        📅 Duration (Days)
                    </label>

                    <input
                        type="number"
                        id="duration"
                        min="1"
                        max="30"
                        value="7"
                        placeholder="Enter number of days"
                    >

                </div>

            </div>


            <!-- GENERATE BUTTON -->
            <section class="options-section">

                <button
                    id="generateRoadmapBtn"
                    class="teach-everything"
                    type="button"
                >
                    🚀 Generate My Roadmap
                </button>

            </section>


            <!-- LOADING -->
            <div
                id="loading"
                class="loading hidden"
            >

                <div class="loader"></div>

                <p>
                    🤖 AI is preparing your personalized roadmap...
                </p>

            </div>


            <!-- RESULT -->
            <section
                id="resultSection"
                class="result-section hidden"
            >

                <div class="result-header">

                    <h2>
                        📚 Your Personalized Roadmap
                    </h2>

                </div>


                <div id="resultContent">

                </div>

            </section>

        </main>

    </div>


    <script src="js/roadmap.js"></script>

</body>

</html>
